<!doctype html><meta charset="utf-8"><title>gif maker</title>
<body style="font-family:sans-serif;background:#222;color:#eee"><div id="log">working…</div><div id="out"></div>
<script type="module">
import {GIFEncoder,quantize,applyPalette} from 'https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js';
const SRC='https://storage.mlcdn.com/account_image/2508696/rnadMGgSxv7AWAb3U01oyW3CWGnMIytWHUVXVGSw.gif';
const log=t=>document.getElementById('log').textContent=t;
async function bmp(url){const b=await (await fetch(url)).blob();return await createImageBitmap(b)}
async function build(ovlName){
  const buf=await (await fetch(SRC)).arrayBuffer();
  const d=new ImageDecoder({data:buf,type:'image/gif'});await d.tracks.ready;
  const n=d.tracks.selectedTrack.frameCount;
  const ov=await bmp('./'+ovlName);
  const W=600,H=338;const c=new OffscreenCanvas(W,H);const x=c.getContext('2d',{willReadFrequently:true});
  const g=GIFEncoder();
  for(let i=0;i<n;i++){const {image}=await d.decode({frameIndex:i});x.clearRect(0,0,W,H);x.drawImage(image,0,0,W,H);x.drawImage(ov,0,0,W,H);
    const delay=Math.round(image.duration/1000);image.close();
    const {data}=x.getImageData(0,0,W,H);const pal=quantize(data,256);const idx=applyPalette(data,pal);g.writeFrame(idx,W,H,{palette:pal,delay});}
  g.finish();return new Blob([g.bytes()],{type:'image/gif'});
}
const res={};
for(const k of ['vip','headsup']){res[k]=await build('ovl-'+k+'.png');const im=document.createElement('img');im.src=URL.createObjectURL(res[k]);document.getElementById('out').append(im)}
window.__res=res;log('done '+res.vip.size+' '+res.headsup.size);
if(window.opener){window.opener.postMessage({type:'mfmgif',vip:res.vip,headsup:res.headsup},'*')}
</script>
